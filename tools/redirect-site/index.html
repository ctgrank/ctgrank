<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shikhor — moved to ctgrank.pages.dev</title>

<!--
  Shikhor now lives at https://ctgrank.pages.dev.
  These Surge domains only redirect; they hold no content.

  Surge can't issue a real 301 (no edge config, and it hijacks /robots.txt
  with "Disallow: /" on every *.surge.sh subdomain), so this is a client-side
  redirect: the script preserves the full path + query, the meta refresh is a
  no-JS fallback to the homepage.
-->
<script>
  (function () {
    var target = "https://ctgrank.pages.dev" +
      location.pathname + location.search + location.hash;
    location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://ctgrank.pages.dev/">
<link rel="canonical" href="https://ctgrank.pages.dev/">
<meta name="robots" content="noindex">

<style>
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: grid; place-items: center; min-height: 100vh; margin: 0;
         background: #f8fafc; color: #0f172a; }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  a { color: #2563eb; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  p { color: #475569; }
</style>
</head>
<body>
<main>
  <h1>Shikhor has moved</h1>
  <p>The Chattogram Board rank lists are now at
     <a href="https://ctgrank.pages.dev/">ctgrank.pages.dev</a>.</p>
  <p>If you aren't redirected automatically, click the link above.</p>
</main>
</body>
</html>
